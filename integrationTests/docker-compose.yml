# Run the Rainbow Grades integration tests in the same container CI uses.
#
#   ./docker_test.sh        # runs every module
#   docker compose run --rm tests ./run.py extra_credit
#   docker compose run --rm tests ./run.py --update
# 
# The image is defined and published from Submitty/DockerImages

services:
    tests:
        image: submitty/rainbow-grades-tests:latest
        pull_policy: missing
        volumes:
            - ..:/RainbowGrades
            # MakefileHelper puts its vendored nlohmann/json at the repository's
            # parent, which is outside the bind mount. Caching it in a named volume
            # keeps it off the host filesystem while avoiding a re-download on every
            # run. Delete it with: docker volume rm integrationtests_vendor
            - vendor:/vendor
        working_dir: /RainbowGrades/integrationTests
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

volumes:
    vendor:
